[project]
name = "aya-api"
version = "0.1.0"
description = "Backend API for AYA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.1",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.35.0",
    "rapidfuzz>=3.10.0",
    "openpyxl>=3.1.5",
    "pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "opencv-python>=4.10.0.84",
    "numpy>=2.1.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.29.4",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.12",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportAny = "none"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "ISC001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "ANN",
    "ARG001",
    "ARG002",
    "BLE001",
    "EM101",
    "EM102",
    "TRY003",
    "TRY300",
    "TRY301",
    "TRY400",
    "S101",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLC0415",
    "PTH",
    "PERF401",
    "FBT",
    "DTZ",
    "B904",
    "ASYNC240",
    "S110",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]
"migrations/**/*.py" = ["ANN", "D", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

