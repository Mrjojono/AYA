services:
  api:
    build: .
    command: uv run uvicorn aya_api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      AYA_DATABASE_URL: ${AYA_DATABASE_URL:-postgresql+asyncpg://aya:aya@db:5432/aya}
      AYA_REDIS_URL: ${AYA_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aya
      POSTGRES_USER: aya
      POSTGRES_PASSWORD: aya
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aya -d aya"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine

volumes:
  postgres_data:

